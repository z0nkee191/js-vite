<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App - GitHub Pages</title>
    <style>:root{--bg-color:#0f172a;--card-bg:#1e293b;--text-color:#f8fafc;--text-muted:#94a3b8;--btn-bg:#3b82f6;--btn-hover:#2563eb}*{box-sizing:border-box;margin:0;padding:0}body{background-color:var(--bg-color);color:var(--text-color);justify-content:center;align-items:center;min-height:100vh;padding:1rem;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex}.card{background-color:var(--card-bg);text-align:center;border:1px solid #ffffff14;border-radius:16px;width:100%;max-width:360px;padding:2.5rem;box-shadow:0 10px 25px -5px #0006}.badge{text-transform:uppercase;letter-spacing:.05em;color:#60a5fa;background:#3b82f633;border-radius:9999px;margin-bottom:1rem;padding:.25rem .75rem;font-size:.75rem;font-weight:600;display:inline-block}h1{margin-bottom:.5rem;font-size:1.5rem}p.subtitle{color:var(--text-muted);margin-bottom:2rem;font-size:.875rem}#counter-value{margin-bottom:2rem;font-size:4rem;font-weight:800;line-height:1;transition:color .2s,transform .2s}.btn-group{justify-content:center;gap:.75rem;display:flex}button{cursor:pointer;background-color:var(--btn-bg);color:#fff;border:none;border-radius:8px;padding:.75rem 1.25rem;font-size:1rem;font-weight:600;transition:background-color .2s,transform .1s}button:hover{background-color:var(--btn-hover)}button:active{transform:scale(.96)}button.secondary{color:#cbd5e1;background-color:#334155}button.secondary:hover{background-color:#475569}</style>
    <script type="module" crossorigin src="/js-vite/assets/index-B87lRGKR.js"></script>
  </head>
  <body>
    <div class="card">
      <span class="badge">Vite + Vanilla JS</span>
      <h1>Інтерактивний лічильник</h1>
      <p class="subtitle">Демонстрація ES-модулів у Vite</p>
      
      <div id="counter-value">0</div>

      <div class="btn-group">
        <button id="btn-decrement">-</button>
        <button id="btn-reset" class="secondary">Скинути</button>
        <button id="btn-increment">+</button>
      </div>
    </div>

  </body>
</html>
