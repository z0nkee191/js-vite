<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App - GitHub Pages</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --btn-bg: #3b82f6;
        --btn-hover: #2563eb;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .card {
        background-color: var(--card-bg);
        padding: 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        text-align: center;
        max-width: 360px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        margin-bottom: 1rem;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }

      p.subtitle {
        color: var(--text-muted);
        font-size: 0.875rem;
        margin-bottom: 2rem;
      }

      #counter-value {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 2rem;
        transition: color 0.2s ease, transform 0.2s ease;
      }

      .btn-group {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }

      button {
        cursor: pointer;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background-color: var(--btn-bg);
        color: white;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      button:hover {
        background-color: var(--btn-hover);
      }

      button:active {
        transform: scale(0.96);
      }

      button.secondary {
        background-color: #334155;
        color: #cbd5e1;
      }

      button.secondary:hover {
        background-color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Vite + Vanilla JS</span>
      <h1>Інтерактивний лічильник</h1>
      <p class="subtitle">Демонстрація ES-модулів у Vite</p>
      
      <div id="counter-value">0</div>

      <div class="btn-group">
        <button id="btn-decrement">-</button>
        <button id="btn-reset" class="secondary">Скинути</button>
        <button id="btn-increment">+</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
